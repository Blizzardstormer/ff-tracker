name: daily
on:
  schedule: [{cron: "0 22 * * *"}]
  workflow_dispatch:
  push: {branches: [main], paths: [owned.txt, build.py]}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add docs && (git diff --cached --quiet || git commit -m update) && git push
